[project]
name = "quickdif"
dynamic = ["version"]
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Beinsezii" }]
requires-python = ">= 3.15"
dependencies = [
    "accelerate>=1.13",
    "diffusers[torch,torchao]>=0.40",
    "peft>=0.19",
    "skrample[all]>=0.7,<0.8",
    "torch>=2.14",                                        # no cp315 torchvision wheels below 0.29, requires torch 2.14
    "torchao>=0.15",
    "transformers[sentencepiece,torch,vision]>=5.5,<5.6",
]

[project.optional-dependencies]
all = ["quickdif"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["quickdif[all]", "ruff>=0.17.3", "ty>=0.0.95", "pytest>=9.2.0"]

[tool.setuptools]
py-modules = ["quickdif"]

[tool.ruff]
line-length = 120
namespace-packages = ["tests"]

[tool.ruff.lint]
select = [
    "A",      # std types
    "ANN",    # annotations
    "BLE",    # blanket except
    "C4",     # comprehension
    "E",      # style errors
    "EM",     # error messages
    "EXE",    # shebangs
    "F",      # format
    "FA",     # future
    "FLY",    # expr fstring
    "FURB",   # syn upgrades
    "G",      # log messages
    "I",      # imports
    "ICN",    # import conventions
    "INP001",
    "ISC",    # str cat
    "LOG",    # logging
    "NPY",    # numpy
    "PERF",   # perflint
    "PIE",    # misc
    "PL",     # pylint
    "PT",     # pytest
    "Q",      # quotes
    "RUF",    # variety
    "T10",    # pdb.trace
    "T20",    # print
    "TC",     # type checking
    "TD",     # todos
    "TRY",    # try/catch
    "UP",     # syn upgrades
    "W",      # style warnings
]
ignore = [
    "G004",   # Log f-string
    "PIE808", # range start 0
    "PLR",    # silly
    "TD003",  # todo require link
    "UP015",  # open() mode='r'
]

[tool.ruff.lint.per-file-ignores]
"latent_colors.py" = ["T201"] # prints

[tool.pytest.ini_options]
python_files = "tests/*.py"

[tool.ty.analysis]
# pyright infers return types recursively; ty defaults to `never` (only where annotated or trivial)
return-type-inference = "always"

[tool.ty.rules]
unused-type-ignore-comment = "error"

[tool.uv]
# pytorch's index caps packaging at 24.1 and uv only consults the first index that has a name. setuptools>=77
# needs packaging>=24.2 to read PEP 639 licenses, which any sdist build (sentencepiece has no cp315 wheels) hits.
build-constraint-dependencies = ["packaging>=24.2"]
